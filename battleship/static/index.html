<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Battleship</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Battleship</h1>
  <div class="controls">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <label for="fleet-style">Fleet</label>
    <select id="fleet-style">
      <option value="military" selected>Military</option>
      <option value="pirate">Pirate</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="mute" title="Toggle sound">🔊</button>
    <label class="vol" for="music-vol" title="Music volume">♪ <input id="music-vol" type="range" min="0" max="100" step="1"></label>
  </div>
  <p id="status"></p>
</header>

<main>
  <section id="placement" class="hidden">
    <div class="board-wrap">
      <h2>Your Fleet</h2>
      <div id="place-board" class="board"></div>
    </div>
    <div class="tray-wrap">
      <h2>Ship Tray</h2>
      <div id="tray"></div>
      <div class="tray-buttons">
        <button id="quick-battle" class="primary">⚡ Quick Battle</button>
        <button id="rotate">Rotate (R)</button>
        <button id="randomize">Randomize</button>
        <button id="start" disabled>Start Battle</button>
      </div>
      <p class="hint">Select a ship, hover the grid to preview, click to place.</p>
    </div>
  </section>

  <section id="battle" class="hidden">
    <div class="board-wrap">
      <h2>Your Fleet</h2>
      <div id="player-board" class="board"></div>
      <h3>Fleet Status</h3>
      <ul id="player-fleet" class="fleet"></ul>
    </div>
    <div class="board-wrap">
      <h2>Enemy Waters</h2>
      <div id="enemy-board" class="board"></div>
      <h3>Enemy Fleet</h3>
      <ul id="enemy-fleet" class="fleet"></ul>
    </div>
    <div class="log-wrap">
      <h2>Event Log</h2>
      <div id="log"></div>
    </div>
  </section>
  <footer>Music: "Hot Swing" by Kevin MacLeod (<a href="https://incompetech.com" target="_blank" rel="noopener">incompetech.com</a>), CC BY 3.0</footer>
</main>

<div id="gameover" class="hidden">
  <canvas id="fx-canvas"></canvas>
  <div class="banner">
    <div id="gameover-kicker" class="kicker"></div>
    <h2 id="gameover-text"></h2>
    <p id="gameover-sub" class="sub"></p>
    <p id="gameover-line" class="statline"></p>
    <p id="gameover-line-enemy" class="statline enemy"></p>
    <ul id="gameover-stats" class="stats"></ul>
    <div class="banner-buttons">
      <button id="play-again">Play Again</button>
      <button id="play-again-quick" class="primary">⚡ Quick Battle</button>
    </div>
  </div>
</div>

<script src="/static/audio.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
